---
- name: Ensuring /var/log/dingo-command directory exists
  file:
    path: "/var/log/kolla/dingo-command-hd05"
    state: "directory"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0770"
  become: true
  with_dict: "{{ dingo_command_hd05_services | select_services_enabled_and_mapped_to_host }}"
- name: Ensuring /var/lib/dingo-command directory exists
  file:
    path: "{{ dingo_command_hd05_workerdir_storage_local_path }}"
    state: "directory"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0770"
  become: true
  with_dict: "{{ dingo_command_hd05_services | select_services_enabled_and_mapped_to_host }}"
  
- name: Ensuring config directories exist
  file:
    path: "{{ node_config_directory }}/{{ item.key }}"
    state: "directory"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0770"
  become: true
  with_dict: "{{ dingo_command_hd05_services | select_services_enabled_and_mapped_to_host }}"

- include_tasks: copy-certs.yml
  when:
    - kolla_copy_ca_into_containers | bool or dingo_command_hd05_enable_tls_backend | bool

- name: Copying over dingo-command.conf
  vars:
    dingo_command: "{{ dingo_command_hd05_services['dingo-command-hd05'] }}"
  template:
    src: "{{ role_path }}/templates/dingo-command.conf.j2"
    dest: "{{ node_config_directory }}/dingo-command-hd05/dingo-command.conf"
    mode: "0660"
  become: true
  when:
    - dingo_command.enabled | bool
  notify:
    - Restart dingo-command-hd05 container

- name: Copying over supervisord.conf
  vars:
    dingo_command: "{{ dingo_command_hd05_services['dingo-command-hd05'] }}"
  template:
    src: "{{ role_path }}/templates/supervisord.conf"
    dest: "{{ node_config_directory }}/dingo-command-hd05/supervisord.conf"
    mode: "0660"
  become: true
  when:
    - dingo_command.enabled | bool
  notify:
    - Restart dingo-command-hd05 container
    
- name: Write dingo_command_hd05_managek8s_config to management.kubeconfig
  copy:
    content: "{{ dingo_command_hd05_managek8s_config }}"
    dest: "{{ node_config_directory }}/dingo-command-hd05/management.kubeconfig"
    mode: "0660"
  become: true
  when:
    - dingo_command_hd05_services['dingo-command-hd05'].enabled | bool
    - dingo_command_hd05_managek8s_config is defined
    - dingo_command_hd05_managek8s_config | length > 0
    
- name: Copying over gunicorn.py
  vars:
    dingo_command: "{{ dingo_command_hd05_services['dingo-command-hd05'] }}"
  template:
    src: "{{ role_path }}/templates/gunicorn.py"
    dest: "{{ node_config_directory }}/dingo-command-hd05/gunicorn.py"
    mode: "0660"
  become: true
  when:
    - dingo_command.enabled | bool
  notify:
    - Restart dingo-command-hd05 container

- include_tasks: "ceph.yml"
  when:
    - dingo_command_hd05_workerdir_storage_type == "ceph"
    - dingo_command_hd05_workerdir_storage_enabled | bool

- name: Include NFS mount tasks if storage type is NFS
  include_tasks: nfs.yml
  when: dingo_command_hd05_workerdir_storage_type == 'nfs'

- name: Ensuring terraform-cache directory exists
  file:
    path: "{{ dingo_command_hd05_workerdir_storage_local_path }}/terraform-cache"
    state: "directory"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0770"
  become: true
  with_dict: "{{ dingo_command_hd05_services | select_services_enabled_and_mapped_to_host }}"

- name: Copy dingo.com terraform providers
  copy:
    src: "{{ role_path }}/templates/dingo.com"
    dest: "{{ dingo_command_hd05_workerdir_storage_local_path }}/terraform-cache/"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0770"
    directory_mode: "0770"
  become: true
  when:
    - dingo_command_hd05_services['dingo-command-hd05'].enabled | bool
  notify:
    - Restart dingo-command-hd05 container

- name: Copy registry.terraform.io terraform providers
  copy:
    src: "{{ role_path }}/templates/registry.terraform.io"
    dest: "{{ dingo_command_hd05_workerdir_storage_local_path }}/terraform-cache/"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0770"
    directory_mode: "0770"
  become: true
  when:
    - dingo_command_hd05_services['dingo-command-hd05'].enabled | bool
  notify:
    - Restart dingo-command-hd05 container