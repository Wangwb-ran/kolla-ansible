---
- import_role:
    name: service-precheck
  vars:
    service_precheck_services: "{{ dingo_command_hd05_services }}"
    service_name: "{{ project_name }}"

- name: Get container facts
  become: true
  kolla_container_facts:
    action: get_containers
    container_engine: "{{ kolla_container_engine }}"
    name:
      - dingo-command-hd05
  register: container_facts

- name: Checking free port for dingo-command-hd05 APIServer
  wait_for:
    host: "{{ api_interface_address }}"
    port: "{{ dingo_command_hd05_listen_port }}"
    connect_timeout: 1
    timeout: 1
    state: stopped
  when:
    - container_facts['dingo-command-hd05'] is not defined
    - inventory_hostname in groups['dingo-command-hd05']
