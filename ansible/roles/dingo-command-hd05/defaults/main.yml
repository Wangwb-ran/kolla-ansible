#   - "[v2:10.220.8.46:3300/0,v1:10.220.8.46:6789/0]"
#   - "[v2:10.220.8.47:3300/0,v1:10.220.8.47:6789/0]"
#   - "[v2:10.220.8.48:3300/0,v1:10.220.8.48:6789/0]"
#   - "[v2:10.220.8.45:3300/0,v1:10.220.8.45:6789/0]"
#   - "[v2:10.220.8.44:3300/0,v1:10.220.8.44:6789/0]"
# dingo_command_hd05_ceph_mon_name: "sd-ceph01"
# dingo_command_hd05_ceph_public_network: "10.220.8.0/22"

dingo_command_hd05_ceph_mon_addresses: "10.220.8.46:6789,10.220.8.47:6789,10.220.8.48:6789"
dingo_command_hd05_ceph_client_name: "dingoops-hdd-fs"
dingo_command_hd05_ceph_mds_namespace: "dingoops-cephfs-hdd"
dingo_command_hd05_ceph_mount_path: "{{ dingo_command_hd05_workerdir_storage_local_path }}"
dingo_command_hd05_ceph_fs_name: "/dingoops-test"

task_timeout: 7500
soft_task_timeout: 7200

# 默认使用本身的地址
center_rpc_transport_url: "{{ rpc_transport_url }}"

aliyun_clickhouse_host: "10.220.244.176"
aliyun_clickhouse_port: 8123
aliyun_clickhouse_user: "user01"
aliyun_clickhouse_password: "YourStrongPassword123!"
aliyun_clickhouse_database: "bsm_monitor"

# aliyun dingodb 上报（conf.j2 的 [aliyun_dingodb] 段引用；若 globals 已定义会覆盖此默认）
aliyun_dingodb_host: "172.30.14.199"
aliyun_dingodb_port: 3307
aliyun_dingodb_user: "bsm_monitor"
aliyun_dingodb_read_user: "bsm_operator"
aliyun_dingodb_password: "bsm_monitor"
aliyun_dingodb_read_password: "bsm_monitor"
aliyun_dingodb_report_database: "bsm_monitor"

metric_write_dingo: false
metric_write_clickhouse: true
openstack_lb_method: "ROUND_ROBIN"
openstack_lb_provider: "amphora"


####################
# hd05 独立实例专属
####################
# 服务开关（在 globals.yml 里打开）
enable_dingo_command_hd05: "no"

# keystone 复用原 dingo-command 用户/密码（引用原实例值，避免重置 hd04 的用户）
dingo_command_hd05_keystone_user: "{{ dingo_command_keystone_user | default('dingo-command') }}"
dingo_command_hd05_keystone_password: "{{ dingo_command_keystone_password }}"
# 独立数据库用户 dingoops_hd05 的密码（沿用原实例密码值即可）
dingo_command_hd05_database_password: "{{ dingo_command_database_password }}"

# 独立 RabbitMQ vhost，避免与原实例共用队列
dingo_command_hd05_vhost: "dingoops_hd05"
dingo_command_hd05_rpc_transport_url: "{{ rpc_transport_url | regex_replace('//[^/]*$', '//' ~ dingo_command_hd05_vhost) }}"
# 是否由本 role 在 bootstrap 阶段自动建 vhost 并授权
dingo_command_hd05_manage_vhost: true
dingo_command_hd05_mq_user: "openstack"
